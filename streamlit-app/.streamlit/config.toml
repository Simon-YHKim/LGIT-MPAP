[theme]
base = "light"
primaryColor = "#8c1d3c"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F7F7"
textColor = "#000000"

# 사용자 피드백 (2026-05-11) — 폐쇄망 사전 점검:
# Streamlit 의 외부 telemetry 호출 차단. 사내 폐쇄망에서 외부 fetch 시도 시
# timeout (~5s) + console error 발생 → 앱 시작 지연. 명시적으로 비활성화.
[browser]
gatherUsageStats = false

# 운영 환경 권장 — 자동 브라우저 오픈 비활성화 + headless mode.
# 운영 PC 에서 streamlit run 실행 시 자동 브라우저 띄우기 방지.
[server]
headless = true
# fileWatcherType = "none"   # 운영 환경에선 hot-reload 불필요 (필요 시 주석 해제)
enableCORS = false
enableXsrfProtection = true